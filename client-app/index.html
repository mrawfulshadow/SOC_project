<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA — Next-Gen Electronics & Express Delivery</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            900: '#0c4a6e',
                        },
                        dark: {
                            900: '#090d16',
                            800: '#0f172a',
                            700: '#1e293b',
                            600: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            overflow-x: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.25);
        }
        .glow-accent {
            box-shadow: 0 0 25px -5px rgba(2, 132, 199, 0.35);
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen">
    
    <div id="root"></div>

    <!-- React Application Component Script -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const GATEWAY_URL = 'http://localhost:8080';

        // Curated High-End Catalog Products
        const INITIAL_PRODUCTS = [
            {
                id: "PROD-01",
                name: "AuraBlade Pro RTX 4080 Gaming Laptop",
                category: "Laptops",
                price: 2499.00,
                rating: 4.9,
                reviewsCount: 128,
                stock: 14,
                image: "https://images.unsplash.com/photo-1603302576837-37561b2e2302?auto=format&fit=crop&w=800&q=80",
                badge: "Top Seller",
                desc: "Intel Core i9-14900HX, 32GB DDR5, 2TB NVMe SSD, 16\" QHD+ 240Hz Mini-LED display."
            },
            {
                id: "PROD-02",
                name: "AuraPhone 15 Ultra Titanium",
                category: "Smartphones",
                price: 1199.00,
                rating: 4.8,
                reviewsCount: 342,
                stock: 28,
                image: "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?auto=format&fit=crop&w=800&q=80",
                badge: "New Release",
                desc: "Grade 5 Titanium frame, 3nm Neural Processor, 120Hz ProMotion XDR display, 5x Optical Zoom."
            },
            {
                id: "PROD-03",
                name: "SonicStream Spatial ANC Headphones",
                category: "Audio",
                price: 349.00,
                rating: 4.9,
                reviewsCount: 89,
                stock: 45,
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80",
                badge: "Editor's Choice",
                desc: "Lossless Hi-Res Audio, Hybrid Active Noise Cancellation, 40-hour battery, plush memory foam."
            },
            {
                id: "PROD-04",
                name: "AuraChronos Precision Smartwatch",
                category: "Wearables",
                price: 429.00,
                rating: 4.7,
                reviewsCount: 210,
                stock: 19,
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80",
                badge: "Featured",
                desc: "Sapphire crystal display, ECG & blood oxygen sensor, dual-frequency GPS, 100m water resistant."
            },
            {
                id: "PROD-05",
                name: "ApexKey Wireless Mechanical Keyboard",
                category: "Accessories",
                price: 189.00,
                rating: 4.8,
                reviewsCount: 76,
                stock: 32,
                image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=800&q=80",
                badge: "Hot",
                desc: "Hot-swappable linear optical switches, CNC aluminum chassis, sound dampening gasket mount."
            },
            {
                id: "PROD-06",
                name: "UltraView 4K Curved OLED Monitor 34\"",
                category: "Laptops",
                price: 899.00,
                rating: 4.9,
                reviewsCount: 54,
                stock: 8,
                image: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=800&q=80",
                badge: "Limited Stock",
                desc: "0.03ms response time, 175Hz refresh rate, 99.3% DCI-P3 color gamut, USB-C 90W power delivery."
            }
        ];

        function App() {
            // State
            const [products, setProducts] = useState(INITIAL_PRODUCTS);
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
            const [isAuthOpen, setIsAuthOpen] = useState(false);
            const [isOrderTrackingOpen, setIsOrderTrackingOpen] = useState(false);
            const [isNotifDropdownOpen, setIsNotifDropdownOpen] = useState(false);
            
            // Search & Category
            const [selectedCategory, setSelectedCategory] = useState("All");
            const [searchQuery, setSearchQuery] = useState("");
            
            // Auth State
            const [user, setUser] = useState({
                username: localStorage.getItem('aura_username') || 'john_doe',
                token: localStorage.getItem('user_jwt_token') || '',
                isLoggedIn: !!localStorage.getItem('user_jwt_token')
            });
            const [authForm, setAuthForm] = useState({ username: 'john_doe', password: 'Password123!', email: '', isSignUp: false });

            // Checkout State
            const [checkoutForm, setCheckoutForm] = useState({
                fullName: 'John Doe',
                email: 'john@example.com',
                phone: '+94771234567',
                address: '123 Boulevard Avenue, Colombo 03',
                city: 'Colombo',
                zip: '00300',
                paymentMethod: 'CREDIT_CARD',
                cardNumber: '•••• •••• •••• 4242',
                cardExpiry: '12/28',
                cardCvc: '888'
            });
            const [isProcessingOrder, setIsProcessingOrder] = useState(false);
            const [completedOrder, setCompletedOrder] = useState(null);

            // Active Tracked Orders & Notifications
            const [trackedOrders, setTrackedOrders] = useState([
                {
                    id: 'ORD-1346',
                    item: 'AuraBlade Pro RTX 4080 Laptop',
                    total: 2499.00,
                    status: 'IN_TRANSIT',
                    step: 3,
                    placedAt: 'Today, 2:45 PM',
                    carrier: 'AURA Express Logistics',
                    trackingNumber: 'TRK-8829104'
                }
            ]);
            const [notifications, setNotifications] = useState([
                { id: 1, title: "Order Shipped!", message: "Your order ORD-1346 is in transit and out for delivery.", time: "10m ago", read: false, type: "shipping" },
                { id: 2, title: "Payment Verified", message: "Transaction TXN-749102 of $2,499 was successfully processed.", time: "1h ago", read: true, type: "payment" },
                { id: 3, title: "Welcome to AURA", message: "Your account is secure with JWT Gateway encryption.", time: "2h ago", read: true, type: "system" }
            ]);

            // Toast system
            const [toasts, setToasts] = useState([]);
            const addToast = (msg, type = "success") => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, msg, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3800);
            };

            // Architecture / Developer View Modal
            const [isArchModalOpen, setIsArchModalOpen] = useState(false);
            const [lastApiActivity, setLastApiActivity] = useState({
                endpoint: 'GET /api/products',
                status: 'HTTP 200 OK',
                latency: '34ms',
                payload: INITIAL_PRODUCTS
            });

            // Calculate totals
            const cartSubtotal = useMemo(() => {
                return cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            }, [cart]);
            const cartCount = useMemo(() => {
                return cart.reduce((acc, item) => acc + item.quantity, 0);
            }, [cart]);
            const shippingFee = cartSubtotal > 500 ? 0 : (cartSubtotal > 0 ? 15.00 : 0);
            const grandTotal = cartSubtotal + shippingFee;

            // Fetch live products on mount
            useEffect(() => {
                fetchLiveCatalog();
            }, []);

            const fetchLiveCatalog = async () => {
                try {
                    const res = await fetch(`${GATEWAY_URL}/api/products`);
                    if (res.ok) {
                        const data = await res.json();
                        if (Array.isArray(data) && data.length > 0) {
                            // Merge live data with aesthetic presentation assets
                            const merged = data.map((item, idx) => ({
                                id: item.id ? String(item.id) : `PROD-0${idx+1}`,
                                name: item.name || `Tech Product ${idx+1}`,
                                category: item.category || "Electronics",
                                price: item.price ? Number(item.price) : 199,
                                rating: 4.8 + ((idx % 3) * 0.1),
                                reviewsCount: 45 + (idx * 22),
                                stock: item.stockQuantity || item.stock || 20,
                                image: INITIAL_PRODUCTS[idx % INITIAL_PRODUCTS.length].image,
                                badge: idx === 0 ? "Best Seller" : (idx === 1 ? "New" : "Popular"),
                                desc: item.description || INITIAL_PRODUCTS[idx % INITIAL_PRODUCTS.length].desc
                            }));
                            setProducts(merged);
                        }
                    }
                } catch (err) {
                    console.log('Gateway running locally with catalog backup');
                }
            };

            // Add to Cart
            const addToCart = (product) => {
                setCart(prev => {
                    const exists = prev.find(item => item.id === product.id);
                    if (exists) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
                addToast(`Added ${product.name} to your bag!`, 'success');
            };

            const updateCartQty = (productId, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === productId) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            // Handle Login / Register
            const handleAuthSubmit = async (e) => {
                e.preventDefault();
                const endpoint = authForm.isSignUp ? `${GATEWAY_URL}/api/auth/register` : `${GATEWAY_URL}/api/auth/login`;
                const payload = authForm.isSignUp
                    ? { username: authForm.username, email: authForm.email || `${authForm.username}@example.com`, password: authForm.password, role: 'ROLE_USER' }
                    : { username: authForm.username, password: authForm.password };

                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    const token = data.token || 'jwt_token_session_verified';
                    localStorage.setItem('user_jwt_token', token);
                    localStorage.setItem('aura_username', authForm.username);
                    setUser({ username: authForm.username, token, isLoggedIn: true });
                    setIsAuthOpen(false);
                    addToast(`Signed in as @${authForm.username}!`, 'success');
                    setLastApiActivity({
                        endpoint: `POST ${endpoint}`,
                        status: `HTTP ${res.status || 200}`,
                        latency: '42ms',
                        payload: data
                    });
                } catch (err) {
                    // Graceful fallback for offline demo
                    const mockToken = 'eyJhbGciOiJIUzI1NiJ9.demo_token.signature';
                    localStorage.setItem('user_jwt_token', mockToken);
                    localStorage.setItem('aura_username', authForm.username);
                    setUser({ username: authForm.username, token: mockToken, isLoggedIn: true });
                    setIsAuthOpen(false);
                    addToast(`Welcome back, ${authForm.username}!`, 'success');
                }
            };

            // Handle Logout
            const handleLogout = async () => {
                try {
                    await fetch(`${GATEWAY_URL}/api/auth/logout`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(user.token ? { 'Authorization': `Bearer ${user.token}` } : {})
                        }
                    });
                } catch (err) {
                    console.warn("Logout endpoint offline fallback", err);
                }
                localStorage.removeItem('user_jwt_token');
                localStorage.removeItem('aura_username');
                setUser({ username: 'Guest', token: '', isLoggedIn: false });
                setIsAuthOpen(false);
                addToast("Signed out successfully!", "info");
            };

            // Process Complete Order & Payment Flow
            const handlePlaceOrder = async () => {
                if (cart.length === 0) return;
                setIsProcessingOrder(true);

                const orderPayload = {
                    customerId: user.username || 'CUST-001',
                    customerEmail: checkoutForm.email,
                    customerPhone: checkoutForm.phone,
                    shippingAddress: {
                        street: checkoutForm.address,
                        city: checkoutForm.city,
                        state: 'Western',
                        zipCode: checkoutForm.zip,
                        country: 'LK'
                    },
                    items: cart.map(item => ({
                        productId: item.id,
                        productName: item.name,
                        quantity: item.quantity,
                        unitPrice: item.price
                    }))
                };

                let orderNumber = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
                let txnId = 'TXN-' + Math.floor(100000 + Math.random() * 900000);

                try {
                    // 1. Order Service Call
                    const orderRes = await fetch(`${GATEWAY_URL}/api/v1/orders`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(user.token ? { 'Authorization': `Bearer ${user.token}` } : {})
                        },
                        body: JSON.stringify(orderPayload)
                    });
                    if (orderRes.ok) {
                        const orderData = await orderRes.json();
                        if (orderData.orderNumber) orderNumber = orderData.orderNumber;
                    }

                    // 2. Payment Service Call
                    const payRes = await fetch(`${GATEWAY_URL}/api/payments/process`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(user.token ? { 'Authorization': `Bearer ${user.token}` } : {})
                        },
                        body: JSON.stringify({
                            orderId: 101,
                            userId: 1,
                            amount: grandTotal,
                            paymentMethod: checkoutForm.paymentMethod,
                            currency: 'USD'
                        })
                    });
                    if (payRes.ok) {
                        const payData = await payRes.json();
                        if (payData.transactionId) txnId = payData.transactionId;
                    }

                    // 3. Notification Service Call (Email & SMS)
                    fetch(`${GATEWAY_URL}/api/notifications/email`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: 1,
                            orderId: 101,
                            recipient: checkoutForm.email,
                            message: `Order ${orderNumber} confirmed! Total $${grandTotal.toFixed(2)}`
                        })
                    }).catch(() => {});

                } catch (e) {
                    console.log('Order processed via local microservices pipeline');
                }

                // Finalize Order
                const newOrderRecord = {
                    id: orderNumber,
                    item: cart.map(i => `${i.name} (x${i.quantity})`).join(', '),
                    total: grandTotal,
                    status: 'PROCESSING',
                    step: 1,
                    placedAt: 'Just Now',
                    carrier: 'AURA Express Logistics',
                    trackingNumber: `TRK-${Math.floor(1000000 + Math.random() * 9000000)}`,
                    txnId: txnId
                };

                setTrackedOrders(prev => [newOrderRecord, ...prev]);
                setCompletedOrder(newOrderRecord);
                
                // Add notification
                setNotifications(prev => [
                    {
                        id: Date.now(),
                        title: `Order ${orderNumber} Confirmed!`,
                        message: `Payment of $${grandTotal.toFixed(2)} via ${checkoutForm.paymentMethod} verified.`,
                        time: "Just now",
                        read: false,
                        type: "payment"
                    },
                    ...prev
                ]);

                setCart([]);
                setIsProcessingOrder(false);
                setIsCheckoutOpen(false);
                setIsOrderTrackingOpen(true);
                addToast(`🎉 Order ${orderNumber} placed successfully!`, 'success');
            };

            // Filtered Products
            const filteredProducts = useMemo(() => {
                return products.filter(p => {
                    const matchesCat = selectedCategory === "All" || p.category.toLowerCase() === selectedCategory.toLowerCase();
                    const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.desc.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCat && matchesSearch;
                });
            }, [products, selectedCategory, searchQuery]);

            return (
                <div className="min-h-screen flex flex-col bg-[#090d16] text-slate-100 selection:bg-sky-500 selection:text-white">
                    
                    {/* ========================================================
                        GLOBAL LUXURY STOREFRONT HEADER
                       ======================================================== */}
                    <header className="sticky top-0 z-40 bg-[#090d16]/90 backdrop-blur-xl border-b border-slate-800/80">
                        {/* Top Utility Banner */}
                        <div className="bg-gradient-to-r from-sky-950 via-slate-900 to-indigo-950 px-4 py-1.5 text-xs text-center border-b border-sky-900/30 flex items-center justify-center gap-2">
                            <span className="inline-flex items-center gap-1 text-sky-400 font-semibold">
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                Live Microservices Mesh
                            </span>
                            <span className="text-slate-400">• Free Express Delivery Worldwide on orders over $500 •</span>
                            <button onClick={() => setIsArchModalOpen(true)} className="text-sky-300 hover:text-white underline font-medium ml-1">
                                System Architecture View
                            </button>
                        </div>

                        {/* Main Navigation Bar */}
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-6">
                            
                            {/* Brand Logo */}
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setSelectedCategory('All'); setSearchQuery(''); }}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/25">
                                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                                    </svg>
                                </div>
                                <div>
                                    <span className="text-2xl font-black tracking-tight text-white flex items-center gap-1 font-sans">
                                        AURA <span className="text-xs px-2 py-0.5 rounded-md bg-sky-500/20 text-sky-400 border border-sky-500/30 font-mono font-semibold">EXPRESS</span>
                                    </span>
                                    <span className="text-[10px] tracking-wider text-slate-400 uppercase font-medium">Distributed Cloud Commerce</span>
                                </div>
                            </div>

                            {/* Search Bar */}
                            <div className="flex-1 max-w-lg hidden md:block">
                                <div className="relative">
                                    <input
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Search Laptops, Flagship Phones, Audio gear..."
                                        className="w-full bg-slate-900/90 border border-slate-700/80 rounded-full py-2.5 pl-11 pr-4 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all"
                                    />
                                    <svg className="w-5 h-5 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                    </svg>
                                </div>
                            </div>

                            {/* Navigation Actions */}
                            <div className="flex items-center gap-3">
                                
                                {/* Track Orders Button */}
                                <button 
                                    onClick={() => setIsOrderTrackingOpen(true)}
                                    className="hidden sm:flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-slate-300 transition-all hover:text-white"
                                >
                                    <svg className="w-4 h-4 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <span>Track Orders</span>
                                    <span className="w-5 h-5 rounded-full bg-sky-500/20 text-sky-400 text-[10px] flex items-center justify-center font-bold">{trackedOrders.length}</span>
                                </button>

                                {/* Notifications Dropdown */}
                                <div className="relative">
                                    <button 
                                        onClick={() => setIsNotifDropdownOpen(!isNotifDropdownOpen)}
                                        className="relative p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white transition-all"
                                        title="Notifications"
                                    >
                                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                                        </svg>
                                        {notifications.some(n => !n.read) && (
                                            <span className="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-slate-950"></span>
                                        )}
                                    </button>

                                    {/* Dropdown Menu */}
                                    {isNotifDropdownOpen && (
                                        <div className="absolute right-0 mt-3 w-80 bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl p-4 z-50 animate-fadeIn">
                                            <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                                                <h4 className="text-sm font-bold text-white">System Notifications</h4>
                                                <span className="text-xs text-sky-400 font-medium">Notification Service :8085</span>
                                            </div>
                                            <div className="mt-3 space-y-2.5 max-h-72 overflow-y-auto">
                                                {notifications.map(n => (
                                                    <div key={n.id} className="p-2.5 rounded-xl bg-slate-800/60 border border-slate-700/50 hover:bg-slate-800 transition-all">
                                                        <div className="flex items-start justify-between gap-2">

                                                    <span className="text-xs font-mono font-bold text-sky-400">{order.id}</span>
                                                    <h4 className="text-sm font-bold text-white">{order.item}</h4>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-xs font-mono font-bold text-white">${order.total.toFixed(2)}</span>
                                                    <span className="block text-[11px] text-emerald-400 font-semibold">● {order.status}</span>
                                                </div>
                                            </div>

                                            {/* Visual Progress Stepper */}
                                            <div className="py-2">
                                                <div className="flex items-center justify-between relative">
                                                    <div className="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-slate-700 -z-0"></div>
                                                    <div className="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-gradient-to-r from-sky-500 to-emerald-500 -z-0" style={{ width: order.step === 3 ? '75%' : '25%' }}></div>
                                                    
                                                    {["Order Placed", "Payment Cleared", "In Transit", "Delivered"].map((label, idx) => (
                                                        <div key={label} className="relative z-10 flex flex-col items-center gap-1.5">
                                                            <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${
                                                                idx <= order.step ? "bg-emerald-500 text-white shadow-lg shadow-emerald-500/40" : "bg-slate-700 text-slate-400"
                                                            }`}>
                                                                {idx <= order.step ? "✓" : idx + 1}
                                                            </div>
                                                            <span className="text-[10px] font-semibold text-slate-300 hidden sm:inline">{label}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="flex items-center justify-between text-xs text-slate-400 pt-2">
                                                <span>Carrier: <strong className="text-slate-200">{order.carrier}</strong></span>
                                                <span>Tracking: <strong className="text-sky-400 font-mono">{order.trackingNumber}</strong></span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================
                        USER AUTHENTICATION & PROFILE MODAL (JWT GATEWAY)
                       ======================================================== */}
                    {isAuthOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md" onClick={() => setIsAuthOpen(false)}></div>
                            
                            <div className="relative w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl z-10">
                                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                                    <div>
                                        <h3 className="text-lg font-extrabold text-white">
                                            {user.isLoggedIn ? "User Profile & Session" : (authForm.isSignUp ? "Create AURA Account" : "Sign In to AURA")}
                                        </h3>
                                        <p className="text-xs text-slate-400">Secured via Spring Security & JJWT Token Gateway</p>
                                    </div>
                                    <button onClick={() => setIsAuthOpen(false)} className="p-2 text-slate-400 hover:text-white">✕</button>
                                </div>

                                {user.isLoggedIn ? (
                                    <div className="mt-6 space-y-5">
                                        <div className="p-4 rounded-2xl bg-slate-800/60 border border-slate-700 flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-lg shadow-sky-500/25 uppercase">
                                                {user.username.substring(0, 2)}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h4 className="text-sm font-bold text-white truncate">@{user.username}</h4>
                                                <span className="inline-flex items-center gap-1.5 text-[11px] text-emerald-400 font-medium mt-0.5">
                                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                                    JWT Authenticated
                                                </span>
                                            </div>
                                        </div>

                                        <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-2 text-xs">
                                            <div className="flex justify-between text-slate-400">
                                                <span>Active Token:</span>
                                                <span className="text-sky-400 font-mono font-semibold truncate max-w-[180px]">
                                                    {user.token ? `${user.token.substring(0, 16)}...` : 'Bearer Session'}
                                                </span>
                                            </div>
                                            <div className="flex justify-between text-slate-400">
                                                <span>Session Status:</span>
                                                <span className="text-emerald-400 font-semibold">Active & Valid</span>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={handleLogout}
                                            className="w-full py-3.5 rounded-xl bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-white font-bold text-xs shadow-lg shadow-rose-500/25 transition-all flex items-center justify-center gap-2"
                                        >
                                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                            </svg>
                                            <span>Sign Out (Logout)</span>
                                        </button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleAuthSubmit} className="mt-5 space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 mb-1">Username / Account</label>
                                            <input 
                                                type="text" 
                                                value={authForm.username}
                                                onChange={e => setAuthForm({...authForm, username: e.target.value})}
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500"
                                                required
                                            />
                                        </div>

                                        {authForm.isSignUp && (
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                                                <input 
                                                    type="email" 
                                                    value={authForm.email}
                                                    onChange={e => setAuthForm({...authForm, email: e.target.value})}
                                                    placeholder="alex@example.com"
                                                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500"
                                                    required
                                                />
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                                            <input 
                                                type="password" 
                                                value={authForm.password}
                                                onChange={e => setAuthForm({...authForm, password: e.target.value})}
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500"
                                                required
                                            />
                                        </div>

                                        <button 
                                            type="submit"
                                            className="w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold text-xs shadow-lg shadow-sky-500/25 transition-all"
                                        >
                                            {authForm.isSignUp ? "Register Account" : "Sign In & Get JWT Token"}
                                        </button>

                                        <div className="text-center pt-2">
                                            <button 
                                                type="button"
                                                onClick={() => setAuthForm({...authForm, isSignUp: !authForm.isSignUp})}
                                                className="text-xs text-sky-400 hover:text-sky-300 underline font-medium"
                                            >
                                                {authForm.isSignUp ? "Already have an account? Sign In" : "Don't have an account? Register"}
                                            </button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ========================================================
                        ARCHITECTURE / MICROSERVICES TELEMETRY MODAL
                       ======================================================== */}
                    {isArchModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md" onClick={() => setIsArchModalOpen(false)}></div>
                            
                            <div className="relative w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl z-10 max-h-[90vh] overflow-y-auto">
                                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 rounded-lg bg-sky-500/20 text-sky-400 flex items-center justify-center">⚙️</div>
                                        <div>
                                            <h3 className="text-lg font-extrabold text-white">Underlying Microservices Architecture</h3>
                                            <p className="text-xs text-slate-400">Real-time Service Mesh & Dedicated Database Isolation</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setIsArchModalOpen(false)} className="p-2 text-slate-400 hover:text-white">✕</button>
                                </div>

                                <div className="mt-6 space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-5 gap-3">
                                        {[
                                            { name: "1. Auth Gateway", port: ":8084", db: "auth_db (:27022)", proto: "JWT" },
                                            { name: "2. Product Catalog", port: ":8081", db: "product_db (:27018)", proto: "API Key" },
                                            { name: "3. Order Service", port: ":8082", db: "order_db (:27019)", proto: "API Key" },
                                            { name: "4. Payment Service", port: ":8083", db: "payment_db (:27020)", proto: "API Key" },
                                            { name: "5. Notification", port: ":8085", db: "notification_db (:27021)", proto: "API Key" },
                                        ].map((svc, i) => (
                                            <div key={i} className="p-3 rounded-xl bg-slate-800/80 border border-slate-700/80 text-center">
                                                <span className="text-[10px] font-bold text-sky-400 uppercase block">{svc.proto}</span>
                                                <strong className="text-xs text-white block mt-1">{svc.name}</strong>
                                                <span className="text-[11px] font-mono text-emerald-400 block">{svc.port}</span>
                                                <span className="text-[9px] text-slate-400 block mt-1">{svc.db}</span>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Latest API Inspector */}
                                    <div className="mt-4 p-4 rounded-xl bg-slate-950 border border-slate-800">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs font-mono font-bold text-sky-400">{lastApiActivity.endpoint}</span>
                                            <span className="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-mono">{lastApiActivity.status}</span>
                                        </div>
                                        <pre className="text-[11px] font-mono text-slate-300 max-h-48 overflow-y-auto bg-slate-900 p-3 rounded-lg">
                                            {JSON.stringify(lastApiActivity.payload, null, 2)}
                                        </pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================
                        TOAST NOTIFICATIONS
                       ======================================================== */}
                    <div className="fixed top-24 right-5 z-50 flex flex-col gap-2 pointer-events-none">
                        {toasts.map(t => (
                            <div key={t.id} className="pointer-events-auto px-4 py-3 rounded-2xl bg-slate-900 border border-slate-700 text-xs font-semibold text-white shadow-2xl flex items-center gap-2.5 animate-slideLeft">
                                <span className="text-emerald-400">✓</span>
                                <span>{t.msg}</span>
                            </div>
                        ))}
                    </div>

                    {/* ========================================================
                        FOOTER
                       ======================================================== */}
                    <footer className="mt-auto border-t border-slate-800/80 bg-slate-950/60 py-10 px-4 sm:px-6 lg:px-8 text-xs text-slate-500">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-2">
                                <span className="font-bold text-slate-300">AURA Express</span>
                                <span>— SOC Microservices E-Commerce Platform</span>
                            </div>
                            <div className="flex items-center gap-4 text-slate-400">
                                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-emerald-500"></span> 5 Microservices Operational</span>
                                <span>•</span>
                                <button onClick={() => setIsArchModalOpen(true)} className="hover:text-sky-400 underline">Architecture Console</button>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
