version: '3.8'

networks:
  soc-internal-net:
    driver: bridge

services:
  # ==========================================
  # Frontend Client App (Port 3000)
  # ==========================================
  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: client-app
    ports:
      - "3500:80"
    networks:
      - soc-internal-net
    restart: always

  # ==========================================
  # Central API Gateway (Port 8080)
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - AUTH_SERVICE_URL=http://auth-service:8084
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
    depends_on:
      - auth-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - soc-internal-net
    restart: always

  # ==========================================
  # 1. Auth Service & Dedicated MongoDB
  # ==========================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}@auth-mongodb:27017/auth_db?authSource=admin
    depends_on:
      - auth-mongodb
    networks:
      - soc-internal-net
    restart: always

  auth-mongodb:
    image: mongo:7.0
    container_name: auth-mongodb
    restart: always
    ports:
      - "27022:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
    volumes:
      - auth_mongodb_data:/data/db
    networks:
      - soc-internal-net

  # ==========================================
  # 2. Product Catalog Service & Dedicated MongoDB
  # ==========================================
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}@product-mongodb:27017/product_db?authSource=admin
    depends_on:
      - product-mongodb
    networks:
      - soc-internal-net
    restart: always

  product-mongodb:
    image: mongo:7.0
    container_name: product-mongodb
    restart: always
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
    volumes:
      - product_mongodb_data:/data/db
    networks:
      - soc-internal-net

  # ==========================================
  # 3. Order Service & Dedicated MongoDB
  # ==========================================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}@order-mongodb:27017/order_db?authSource=admin
    depends_on:
      - order-mongodb
    networks:
      - soc-internal-net
    restart: always

  order-mongodb:
    image: mongo:7.0
    container_name: order-mongodb
    restart: always
    ports:
      - "27019:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
    volumes:
      - order_mongodb_data:/data/db
    networks:
      - soc-internal-net

  # ==========================================
  # 4. Payment Service & Dedicated MongoDB
  # ==========================================
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}@payment-mongodb:27017/payment_db?authSource=admin
    depends_on:
      - payment-mongodb
    networks:
      - soc-internal-net
    restart: always

  payment-mongodb:
    image: mongo:7.0
    container_name: payment-mongodb
    restart: always
    ports:
      - "27020:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
    volumes:
      - payment_mongodb_data:/data/db
    networks:
      - soc-internal-net

  # ==========================================
  # 5. Notification Service & Dedicated MongoDB
  # ==========================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}@notification-mongodb:27017/notification_db?authSource=admin
    depends_on:
      - notification-mongodb
    networks:
      - soc-internal-net
    restart: always

  notification-mongodb:
    image: mongo:7.0
    container_name: notification-mongodb
    restart: always
    ports:
      - "27021:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
    volumes:
      - notification_mongodb_data:/data/db
    networks:
      - soc-internal-net

# ==========================================
# Persistent Named Volumes for 5 Databases
# ==========================================
volumes:
  auth_mongodb_data:
    driver: local
  product_mongodb_data:
    driver: local
  order_mongodb_data:
    driver: local
  payment_mongodb_data:
    driver: local
  notification_mongodb_data:
    driver: local
